<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shortnotes — chhote notes, clear concepts</title>
  <desc id="desc">Banner showing the Shortnotes name, the tagline, and three sample cards: a term and meaning note, a flashcard and a streak.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="1" stop-color="#1c2040"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="180" fill="#a5b4fc" opacity="0.07"/>
  <circle cx="120" cy="340" r="140" fill="#fcd57a" opacity="0.05"/>

  <!-- Brand -->
  <g transform="translate(72 84)">
    <rect width="54" height="54" rx="14" fill="#a5b4fc"/>
    <path d="M14 17h10a5 5 0 0 1 5 5v17a4 4 0 0 0-4-4H14zM40 17H30a5 5 0 0 0-5 5v17a4 4 0 0 1 4-4h11z" fill="none" stroke="#12142a" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="72" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#eceef2">shortnotes<tspan fill="#a5b4fc">.</tspan></text>
  </g>
  <text x="72" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#eceef2">Chhote notes.</text>
  <text x="72" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#glow)">Clear concepts.</text>
  <text x="72" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a0a6b2">Hinglish + English revision notes · interactive visuals · flashcards · interview practice</text>

  <!-- Note card -->
  <g transform="translate(700 52)">
    <rect width="420" height="92" rx="16" fill="#15181d" stroke="#262a33"/>
    <text x="22" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a0a6b2">QUICK REVISION</text>
    <text x="22" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c9cdd5"><tspan font-weight="700" fill="#eceef2">Closure</tspan> — function apna lexical scope yaad rakhta hai.</text>
  </g>
  <!-- Flashcard -->
  <g transform="translate(700 164)">
    <rect width="250" height="144" rx="18" fill="#1f2340" stroke="#3f4785"/>
    <text x="125" y="46" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#a0a6b2">TERM</text>
    <text x="125" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#eceef2">Event loop</text>
    <text x="125" y="120" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a0a6b2">Space se palto ↻</text>
  </g>
  <!-- Streak -->
  <g transform="translate(970 164)">
    <rect width="150" height="144" rx="18" fill="#3a2413"/>
    <text x="75" y="62" text-anchor="middle" font-size="34">🔥</text>
    <text x="75" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#fdba74">7</text>
    <text x="75" y="126" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#fdba74">DAY STREAK</text>
  </g>
</svg>
